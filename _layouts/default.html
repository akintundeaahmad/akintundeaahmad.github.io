<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title == "Home" %}{{ site.title | escape }}{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title == 'Home' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
  </head>
  <body class="page-{{ page.page_kind | default: 'standard' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" class="page-main">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
