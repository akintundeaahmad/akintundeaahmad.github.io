<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Akintunde Ahmad, home">
    <span class="wordmark-mark" aria-hidden="true">AA</span>
    <span class="wordmark-name">Akintunde Ahmad</span>
  </a>
  <nav class="primary-nav" aria-label="Main navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
